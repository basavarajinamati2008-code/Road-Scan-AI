<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Soil & Grass Textures -->
    <radialGradient id="terrainGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d3b2b" />
      <stop offset="60%" stop-color="#1f2c1e" />
      <stop offset="100%" stop-color="#141c13" />
    </radialGradient>
    <linearGradient id="soilShoulder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d6e63" />
      <stop offset="30%" stop-color="#a1887f" />
      <stop offset="70%" stop-color="#795548" />
      <stop offset="100%" stop-color="#5d4037" />
    </linearGradient>
    
    <!-- Asphalt Pavement Gradient -->
    <linearGradient id="freshAsphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262d35" />
      <stop offset="40%" stop-color="#1e242a" />
      <stop offset="70%" stop-color="#232a31" />
      <stop offset="100%" stop-color="#1c2126" />
    </linearGradient>

    <!-- Sub-base unpaved layer -->
    <linearGradient id="gravelSubBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4" />
      <stop offset="50%" stop-color="#d7ccc8" />
      <stop offset="100%" stop-color="#a1887f" />
    </linearGradient>

    <!-- Pothole Gradient -->
    <radialGradient id="potholeCavity" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#090b0e" />
      <stop offset="60%" stop-color="#171a1e" />
      <stop offset="100%" stop-color="#2b313a" />
    </radialGradient>

    <!-- Drone HUD Grids -->
    <pattern id="hudGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Natural Terrain -->
  <rect width="1200" height="800" fill="url(#terrainGrad)" />

  <!-- Natural Landscape Foliage & Contours -->
  <path d="M 0,0 Q 300,120 600,80 T 1200,40 L 1200,0 Z" fill="#243322" opacity="0.6"/>
  <path d="M 0,800 Q 350,680 700,740 T 1200,690 L 1200,800 Z" fill="#243322" opacity="0.6"/>
  
  <!-- Terrain Trees/Bush Clusters -->
  <circle cx="120" cy="90" r="28" fill="#1b2e19" opacity="0.8"/>
  <circle cx="145" cy="80" r="32" fill="#254223" opacity="0.9"/>
  <circle cx="280" cy="110" r="24" fill="#1e361b" opacity="0.85"/>
  <circle cx="890" cy="720" r="35" fill="#1b2e19" opacity="0.8"/>
  <circle cx="920" cy="700" r="40" fill="#274624" opacity="0.9"/>
  <circle cx="1060" cy="740" r="26" fill="#1e361b" opacity="0.7"/>
  <circle cx="80" cy="710" r="30" fill="#233d20" opacity="0.85"/>

  <!-- Earthen Highway Shoulders (Left & Right) -->
  <polygon points="0,210 1200,210 1200,590 0,590" fill="url(#soilShoulder)" />

  <!-- Granular Sub-Base Course (Unpaved ongoing section on the right KM 8.680 - 8.850) -->
  <polygon points="850,230 1200,230 1200,570 850,570" fill="url(#gravelSubBase)" />
  <!-- Gravel texture specks -->
  <g fill="#795548" opacity="0.4">
    <circle cx="880" cy="270" r="3"/><circle cx="910" cy="340" r="2.5"/><circle cx="950" cy="420" r="4"/><circle cx="980" cy="310" r="3"/>
    <circle cx="1020" cy="490" r="3.5"/><circle cx="1080" cy="360" r="3"/><circle cx="1140" cy="440" r="4"/><circle cx="1110" cy="280" r="2.5"/>
    <circle cx="890" cy="510" r="3.2"/><circle cx="940" cy="530" r="2.8"/><circle cx="1160" cy="520" r="3.5"/><circle cx="1040" cy="250" r="3"/>
  </g>

  <!-- Paved Bituminous Asphalt Road Carriageway (Left to Middle KM 8.000 to KM 8.680) -->
  <polygon points="0,230 850,230 840,570 0,570" fill="url(#freshAsphalt)" />

  <!-- Road Transition Layer (Tack Coat edge) -->
  <polygon points="835,230 855,230 845,570 825,570" fill="#14171a" opacity="0.7"/>

  <!-- Center Concrete Median Divider Barrier -->
  <rect x="0" y="394" width="845" height="12" fill="#94a3b8" />
  <rect x="0" y="397" width="845" height="6" fill="#cbd5e1" />

  <!-- Road Lane Markings (White dashed lines) -->
  <line x1="0" y1="310" x2="820" y2="310" stroke="#f8fafc" stroke-width="4" stroke-dasharray="35 25" opacity="0.85" />
  <line x1="0" y1="490" x2="820" y2="490" stroke="#f8fafc" stroke-width="4" stroke-dasharray="35 25" opacity="0.85" />

  <!-- Solid Outer Shoulder Edge Lines -->
  <line x1="0" y1="240" x2="830" y2="240" stroke="#f8fafc" stroke-width="5" opacity="0.9" />
  <line x1="0" y1="560" x2="830" y2="560" stroke="#f8fafc" stroke-width="5" opacity="0.9" />

  <!-- Construction Heavy Machinery (Asphalt Paver & Vibratory Roller) -->
  <!-- Asphalt Paver at KM 8.680 -->
  <g transform="translate(810, 430)">
    <rect x="-15" y="-30" width="70" height="60" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <rect x="-10" y="-20" width="30" height="40" fill="#1e293b"/>
    <rect x="25" y="-25" width="25" height="50" fill="#334155"/>
    <circle cx="5" cy="-28" r="4" fill="#f97316"/>
    <circle cx="5" cy="28" r="4" fill="#f97316"/>
    <!-- Material screed plate -->
    <rect x="-25" y="-35" width="10" height="70" fill="#475569"/>
  </g>

  <!-- Road Roller on Shoulder -->
  <g transform="translate(180, 180)">
    <rect x="-10" y="-15" width="45" height="30" rx="3" fill="#f59e0b"/>
    <rect x="-15" y="-12" width="10" height="24" rx="2" fill="#334155"/>
    <rect x="25" y="-12" width="10" height="24" rx="2" fill="#334155"/>
  </g>

  <!-- Survey Field Tripod & Flag -->
  <circle cx="100" cy="180" r="3" fill="#ef4444"/>
  <line x1="100" y1="180" x2="100" y2="168" stroke="#ef4444" stroke-width="2"/>
  <polygon points="100,168 112,173 100,178" fill="#ef4444"/>

  <!-- ================= DETECTED DEFECTS IN IMAGERY ================= -->
  <!-- Defect 1: Deep Pothole Hazard at KM 8.420 (x: 408, y: 336) -->
  <g id="visual-pothole-1">
    <ellipse cx="450" cy="350" rx="26" ry="18" fill="url(#potholeCavity)" stroke="#3f3f46" stroke-width="2"/>
    <ellipse cx="448" cy="352" rx="16" ry="10" fill="#090b0e"/>
    <!-- Loose Aggregate Specks -->
    <circle cx="438" cy="346" r="2.5" fill="#71717a"/>
    <circle cx="458" cy="355" r="3" fill="#a1a1aa"/>
    <circle cx="442" cy="358" r="2" fill="#52525b"/>
  </g>

  <!-- Defect 2: Sub-Base Cavity at KM 8.510 (x: 816, y: 440) -->
  <g id="visual-pothole-2">
    <ellipse cx="780" cy="460" rx="20" ry="14" fill="url(#potholeCavity)" stroke="#3f3f46" stroke-width="1.5"/>
    <ellipse cx="778" cy="462" rx="12" ry="7" fill="#090b0e"/>
    <circle cx="772" cy="459" r="2" fill="#a1a1aa"/>
  </g>

  <!-- Defect 3: Longitudinal Cracks (x: 240, y: 200) -->
  <g id="visual-crack-1">
    <path d="M 240,285 Q 280,288 320,283 T 390,290 T 460,282 T 510,286" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M 320,283 L 335,274" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M 420,284 L 435,296" fill="none" stroke="#111827" stroke-width="1.5"/>
  </g>

  <!-- Defect 4: Raveling / Surface Weathering -->
  <g id="visual-raveling-1" opacity="0.6">
    <ellipse cx="640" cy="270" rx="45" ry="25" fill="#3f3f46" opacity="0.4"/>
    <circle cx="620" cy="265" r="2" fill="#71717a"/><circle cx="645" cy="275" r="1.8" fill="#a1a1aa"/>
    <circle cx="660" cy="260" r="2.2" fill="#52525b"/><circle cx="635" cy="280" r="2" fill="#71717a"/>
  </g>

  <!-- Defect 5: Edge Break Distress -->
  <g id="visual-edgebreak-1">
    <path d="M 720,240 Q 740,248 760,242 T 800,249" fill="#8d6e63" stroke="#262d35" stroke-width="2"/>
  </g>

  <!-- ================= DRONE TELEMETRY HUD OVERLAY ================= -->
  <!-- HUD Grid Background -->
  <rect width="1200" height="800" fill="url(#hudGrid)" pointer-events="none" />

  <!-- Corner Viewfinder Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 30,60 L 30,30 L 60,30" />
    <path d="M 1140,30 L 1170,30 L 1170,60" />
    <path d="M 30,740 L 30,770 L 60,770" />
    <path d="M 1170,740 L 1170,770 L 1140,770" />
  </g>

  <!-- Central UAV Targeting Reticle -->
  <g transform="translate(600, 400)" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9">
    <circle cx="0" cy="0" r="36" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <line x1="-50" y1="0" x2="-12" y2="0" />
    <line x1="12" y1="0" x2="50" y2="0" />
    <line x1="0" y1="-50" x2="0" y2="-12" />
    <line x1="0" y1="12" x2="0" y2="50" />
  </g>

  <!-- Top Flight Telemetry Bar -->
  <rect x="30" y="30" width="1140" height="42" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="56" fill="#38bdf8" font-family="'Segoe UI', monospace, sans-serif" font-size="14" font-weight="bold">ROADSCAN AI // AERIAL MISSION TELEMETRY</text>
  <text x="420" y="56" fill="#94a3b8" font-family="'Segoe UI', monospace, sans-serif" font-size="13">ALT: <tspan fill="#f8fafc" font-weight="bold">48.5 m AGL</tspan></text>
  <text x="550" y="56" fill="#94a3b8" font-family="'Segoe UI', monospace, sans-serif" font-size="13">GSD: <tspan fill="#f8fafc" font-weight="bold">1.15 cm/px</tspan></text>
  <text x="690" y="56" fill="#94a3b8" font-family="'Segoe UI', monospace, sans-serif" font-size="13">SPD: <tspan fill="#f8fafc" font-weight="bold">4.2 m/s</tspan></text>
  <text x="810" y="56" fill="#94a3b8" font-family="'Segoe UI', monospace, sans-serif" font-size="13">GPS: <tspan fill="#f8fafc" font-weight="bold">13.0827°N, 75.0135°E</tspan></text>
  <circle cx="1060" cy="51" r="5" fill="#22c55e" />
  <text x="1075" y="56" fill="#22c55e" font-family="'Segoe UI', monospace, sans-serif" font-size="12" font-weight="bold">RTK FIXED</text>

  <!-- Bottom Chainage & Corridor Info -->
  <rect x="30" y="728" width="460" height="42" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
  <text x="48" y="754" fill="#38bdf8" font-family="'Segoe UI', monospace, sans-serif" font-size="13" font-weight="bold">PROJECT: NH-169 CORRIDOR (KM 8.000 - 8.850)</text>

  <!-- Scale Bar on bottom right -->
  <g transform="translate(1000, 745)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#f8fafc" stroke-width="3"/>
    <line x1="70" y1="-4" x2="70" y2="4" stroke="#f8fafc" stroke-width="2"/>
    <line x1="140" y1="-6" x2="140" y2="6" stroke="#f8fafc" stroke-width="3"/>
    <text x="45" y="-10" fill="#f8fafc" font-family="'Segoe UI', monospace, sans-serif" font-size="12" font-weight="bold">50 METERS</text>
  </g>
</svg>
