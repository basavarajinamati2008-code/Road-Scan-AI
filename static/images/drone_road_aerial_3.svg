<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="terrainGrad3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#243022" />
      <stop offset="100%" stop-color="#121a11" />
    </radialGradient>
    <linearGradient id="subbaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1887f" />
      <stop offset="50%" stop-color="#bcaaa4" />
      <stop offset="100%" stop-color="#8d6e63" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#terrainGrad3)" />

  <!-- Granular Sub-Base Highway Course -->
  <polygon points="0,220 1200,220 1200,580 0,580" fill="url(#subbaseGrad)" stroke="#5d4037" stroke-width="2"/>

  <!-- Compaction Tire Tracks -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#795548" stroke-width="6" stroke-dasharray="10 5" opacity="0.5"/>
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#795548" stroke-width="6" stroke-dasharray="10 5" opacity="0.5"/>
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#795548" stroke-width="6" stroke-dasharray="10 5" opacity="0.5"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#795548" stroke-width="6" stroke-dasharray="10 5" opacity="0.5"/>

  <!-- Construction Motor Grader -->
  <g transform="translate(600, 390)">
    <rect x="-40" y="-20" width="80" height="40" rx="4" fill="#eab308"/>
    <rect x="-30" y="-12" width="25" height="24" fill="#1e293b"/>
    <rect x="25" y="-25" width="8" height="50" fill="#475569"/>
  </g>

  <!-- HUD Overlay -->
  <g transform="translate(600, 400)" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.9">
    <circle cx="0" cy="0" r="36" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>
  <rect x="30" y="30" width="1140" height="42" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="56" fill="#38bdf8" font-family="'Segoe UI', monospace, sans-serif" font-size="14" font-weight="bold">ROADSCAN AI // WMM SUB-BASE COMPACTION SURVEY</text>
  <text x="560" y="56" fill="#94a3b8" font-family="'Segoe UI', monospace, sans-serif" font-size="13">ALT: <tspan fill="#f8fafc">45.0m</tspan> | GSD: <tspan fill="#f8fafc">1.10 cm/px</tspan> | GPS: <tspan fill="#f8fafc">13.0780°N, 75.0080°E</tspan></text>
