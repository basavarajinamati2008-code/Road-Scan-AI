<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Outer AI Scan Ring -->
  <circle cx="24" cy="24" r="21" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  
  <!-- Drone Wings & Quad Rotors -->
  <line x1="10" y1="10" x2="38" y2="38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="10" x2="10" y2="38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Rotors -->
  <circle cx="10" cy="10" r="4.5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="38" cy="10" r="4.5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="10" cy="38" r="4.5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="38" cy="38" r="4.5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" fill-opacity="0.8"/>
  
  <!-- Highway Road Perspective in Center -->
  <polygon points="18,34 30,34 27,15 21,15" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <!-- Road Center Dashed Stripe -->
  <line x1="24" y1="17" x2="24" y2="33" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  
  <!-- Central AI Drone Sensor Pod -->
  <circle cx="24" cy="24" r="6" fill="url(#grad1)" stroke="#e0f2fe" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="2.2" fill="#ffffff"/>
  
  <!-- Scanning Radar Arc -->
  <path d="M 16,14 A 14,14 0 0,1 32,14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
</svg>
